<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>iPhone Mic Bridge</title>
<style>
    :root {
        --bg: #0b0d10;
        --panel: #15181d;
        --panel-2: #1d222a;
        --text: #e8eaed;
        --muted: #8a93a0;
        --accent: #4ade80;
        --warn: #fbbf24;
        --err: #ef4444;
        --call: #a78bfa;
        --border: #232932;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overscroll-behavior: none;
    }
    body {
        display: flex; flex-direction: column;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        max-width: 520px; margin: 0 auto;
    }
    header {
        padding: 24px 0 16px;
        display: flex; justify-content: space-between; align-items: center;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0; }
    .status {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 14px; color: var(--muted);
    }
    .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--muted);
        box-shadow: 0 0 0 0 rgba(0,0,0,0);
        transition: background .2s, box-shadow .2s;
    }
    .dot.live { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .dot.connecting { background: var(--warn); animation: pulse 1s infinite; }
    .dot.reconnecting { background: var(--warn); animation: pulse 1s infinite; }
    .dot.err { background: var(--err); }
    .dot.call { background: var(--call); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .4; } }

    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 14px;
    }

    .start-btn, .resume-btn {
        display: block; width: 100%;
        padding: 20px;
        font-size: 18px; font-weight: 600;
        background: var(--accent); color: #0b0d10;
        border: none; border-radius: 14px;
        cursor: pointer;
        transition: transform .05s, opacity .2s;
    }
    .start-btn:active, .resume-btn:active { transform: scale(.98); }
    .start-btn:disabled { background: var(--panel-2); color: var(--muted); }
    .resume-btn { background: var(--call); color: #fff; margin-top: 8px; }

    .row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
    .row:first-child { margin-top: 0; }
    .row label { flex: 0 0 auto; color: var(--muted); font-size: 14px; min-width: 60px; }
    .row .value { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }

    input[type=range] {
        -webkit-appearance: none; appearance: none;
        flex: 1; height: 32px; background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
        height: 6px; border-radius: 3px; background: var(--panel-2);
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 26px; height: 26px; border-radius: 50%;
        background: var(--accent); margin-top: -10px;
        border: 3px solid var(--bg);
    }

    .mute-btn {
        padding: 12px 20px;
        font-size: 15px; font-weight: 600;
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border); border-radius: 10px;
        cursor: pointer;
    }
    .mute-btn.muted { background: var(--err); color: #fff; border-color: var(--err); }

    .meter {
        position: relative;
        height: 6px; width: 100%;
        background: var(--panel-2); border-radius: 3px; overflow: hidden;
    }
    .meter > div {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--warn) 80%, var(--err));
        transition: width .05s linear;
    }

    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .hidden { display: none !important; }

    footer {
        margin-top: auto; padding: 16px 0;
        color: var(--muted); font-size: 12px; text-align: center;
    }
</style>
</head>
<body>

<header>
    <h1>iPhone Mic Bridge</h1>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">Idle</span></span>
</header>

<div id="startCard" class="card">
    <p class="hint" style="margin:0 0 16px">
        Tap Start to grant mic access and begin streaming to your PC.
    </p>
    <button id="startBtn" class="start-btn">Start</button>
</div>

<div id="controls" class="card hidden">
    <div class="row">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="200" value="100">
        <span class="value" id="volumeValue">100%</span>
    </div>
    <div class="row">
        <label>Level</label>
        <div class="meter"><div id="level"></div></div>
    </div>
    <div class="row">
        <label>Latency</label>
        <span class="value" id="latencyValue">—</span>
    </div>
    <div class="row" style="justify-content:flex-end">
        <button id="muteBtn" class="mute-btn">Mute</button>
    </div>
    <button id="resumeBtn" class="resume-btn hidden">Tap to Resume</button>
</div>

<div id="errorCard" class="card hidden">
    <p id="errorText" class="hint" style="color:var(--err);margin:0"></p>
</div>

<footer>LAN-only — no auth, no encryption</footer>

<script>
"use strict";

const CHUNK_SAMPLES = 2048;
const SAMPLE_RATE   = 48000;

const els = {
    startCard:    document.getElementById('startCard'),
    startBtn:     document.getElementById('startBtn'),
    controls:     document.getElementById('controls'),
    volume:       document.getElementById('volume'),
    volumeValue:  document.getElementById('volumeValue'),
    level:        document.getElementById('level'),
    latencyValue: document.getElementById('latencyValue'),
    muteBtn:      document.getElementById('muteBtn'),
    resumeBtn:    document.getElementById('resumeBtn'),
    errorCard:    document.getElementById('errorCard'),
    errorText:    document.getElementById('errorText'),
    dot:          document.getElementById('dot'),
    statusText:   document.getElementById('statusText'),
};

const state = {
    audioCtx:    null,
    stream:      null,
    source:      null,
    gain:        null,
    worklet:     null,
    ws:          null,
    muted:       false,
    connected:   false,
    interrupted: false,
    reconnectDelay: 1000,
    reconnectTimer: null,
    pingTimer:   null,
    pingSentAt:  0,
    keepAliveOsc: null,
};

function setStatus(kind, text) {
    els.dot.className = 'dot ' + kind;
    els.statusText.textContent = text;
}

function showError(msg) {
    els.errorCard.classList.remove('hidden');
    els.errorText.textContent = msg;
}

function clearError() {
    els.errorCard.classList.add('hidden');
    els.errorText.textContent = '';
}

const workletSrc = `
class PCMProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this._chunk = new Float32Array(${CHUNK_SAMPLES});
        this._offset = 0;
    }
    process(inputs) {
        const input = inputs[0];
        if (!input || !input[0]) return true;
        const ch = input[0];
        let peak = 0;
        for (let i = 0; i < ch.length; i++) {
            const v = ch[i];
            this._chunk[this._offset++] = v;
            const a = v < 0 ? -v : v;
            if (a > peak) peak = a;
            if (this._offset === this._chunk.length) {
                const copy = this._chunk.slice();
                this.port.postMessage({ pcm: copy.buffer, peak }, [copy.buffer]);
                this._offset = 0;
                peak = 0;
            }
        }
        return true;
    }
}
registerProcessor('pcm-processor', PCMProcessor);
`;

function workletURL() {
    const blob = new Blob([workletSrc], { type: 'application/javascript' });
    return URL.createObjectURL(blob);
}

function keepAudioSessionAlive(ctx) {
    if (state.keepAliveOsc) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    state.keepAliveOsc = osc;
}

function wsURL() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${location.host}/ws`;
}

function connectWS() {
    if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;

    setStatus('connecting', 'Connecting…');
    let ws;
    try {
        ws = new WebSocket(wsURL());
    } catch (e) {
        scheduleReconnect();
        return;
    }
    ws.binaryType = 'arraybuffer';
    state.ws = ws;

    ws.onopen = () => {
        state.connected = true;
        state.reconnectDelay = 1000;
        if (state.interrupted) {
            setStatus('call', 'Call in progress');
        } else {
            setStatus('live', 'Live');
        }
        startPingLoop();
    };

    ws.onmessage = (ev) => {
        if (typeof ev.data === 'string' && ev.data === 'pong') {
            const rtt = performance.now() - state.pingSentAt;
            els.latencyValue.textContent = `${Math.round(rtt)} ms`;
        }
    };

    ws.onclose = () => {
        state.connected = false;
        stopPingLoop();
        if (!state.interrupted) {
            setStatus('reconnecting', 'Reconnecting…');
        }
        scheduleReconnect();
    };

    ws.onerror = () => {
        // onclose will fire next — handle there
    };
}

function scheduleReconnect() {
    if (state.reconnectTimer) return;
    state.reconnectTimer = setTimeout(() => {
        state.reconnectTimer = null;
        state.reconnectDelay = Math.min(state.reconnectDelay * 2, 30000);
        connectWS();
    }, state.reconnectDelay);
}

function startPingLoop() {
    stopPingLoop();
    state.pingTimer = setInterval(() => {
        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
            state.pingSentAt = performance.now();
            try { state.ws.send('ping'); } catch (_) {}
        }
    }, 5000);
}

function stopPingLoop() {
    if (state.pingTimer) { clearInterval(state.pingTimer); state.pingTimer = null; }
}

async function startStreaming() {
    if (!state.audioCtx) return;
    if (state.audioCtx.state !== 'running') {
        try { await state.audioCtx.resume(); } catch (_) {}
    }

    if (!state.source && state.stream) {
        state.source = state.audioCtx.createMediaStreamSource(state.stream);
        state.source.connect(state.gain);
        state.gain.connect(state.worklet);
    }
}

function stopStreaming() {
    if (state.source) {
        try { state.source.disconnect(); } catch (_) {}
        state.source = null;
    }
}

async function start() {
    clearError();
    els.startBtn.disabled = true;
    setStatus('connecting', 'Requesting mic…');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError(
            'This page is not a secure context — Safari blocks mic access. ' +
            'Make sure the URL starts with https:// and accept the cert warning.'
        );
        setStatus('err', 'Insecure');
        els.startBtn.disabled = false;
        return;
    }

    try {
        state.stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                channelCount: 1,
                sampleRate: SAMPLE_RATE,
                noiseSuppression: false,
                echoCancellation: true,
                autoGainControl: false,
            },
            video: false,
        });
    } catch (e) {
        showError('Microphone access denied: ' + (e && e.message ? e.message : e));
        setStatus('err', 'No mic');
        els.startBtn.disabled = false;
        return;
    }

    const AC = window.AudioContext || window.webkitAudioContext;
    state.audioCtx = new AC({ sampleRate: SAMPLE_RATE });

    try {
        await state.audioCtx.audioWorklet.addModule(workletURL());
    } catch (e) {
        showError('AudioWorklet unsupported: ' + e.message);
        setStatus('err', 'Unsupported');
        els.startBtn.disabled = false;
        return;
    }

    state.gain = state.audioCtx.createGain();
    state.gain.gain.value = parseInt(els.volume.value, 10) / 100;

    state.worklet = new AudioWorkletNode(state.audioCtx, 'pcm-processor');
    state.worklet.port.onmessage = (ev) => {
        const { pcm, peak } = ev.data;
        if (peak !== undefined) {
            els.level.style.width = `${Math.min(100, Math.round(peak * 140))}%`;
        }
        if (!state.muted && state.ws && state.ws.readyState === WebSocket.OPEN) {
            try { state.ws.send(pcm); } catch (_) {}
        }
    };

    keepAudioSessionAlive(state.audioCtx);

    state.audioCtx.addEventListener('statechange', () => {
        const s = state.audioCtx.state;
        if (s === 'interrupted' || s === 'suspended') {
            state.interrupted = true;
            stopStreaming();
            setStatus('call', 'Call in progress');
            els.resumeBtn.classList.remove('hidden');
        } else if (s === 'running') {
            if (state.interrupted) {
                state.interrupted = false;
                els.resumeBtn.classList.add('hidden');
                if (state.connected) setStatus('live', 'Live');
                else setStatus('reconnecting', 'Reconnecting…');
            }
            startStreaming();
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state.audioCtx) {
            state.audioCtx.resume().then(() => {
                if (state.ws && state.ws.readyState === WebSocket.OPEN) startStreaming();
            }).catch(() => {});
        }
    });

    els.startCard.classList.add('hidden');
    els.controls.classList.remove('hidden');

    await startStreaming();
    connectWS();
}

els.startBtn.addEventListener('click', start, { once: false });

els.volume.addEventListener('input', () => {
    const v = parseInt(els.volume.value, 10);
    els.volumeValue.textContent = v + '%';
    if (state.gain) state.gain.gain.value = v / 100;
});

els.muteBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    els.muteBtn.classList.toggle('muted', state.muted);
    els.muteBtn.textContent = state.muted ? 'Unmute' : 'Mute';
});

els.resumeBtn.addEventListener('click', async () => {
    if (!state.audioCtx) return;
    try {
        await state.audioCtx.resume();
    } catch (e) {
        showError('Could not resume: ' + e.message);
    }
});
</script>
</body>
</html>
